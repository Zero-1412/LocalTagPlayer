name: 核心查询与用户数据回归

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "windows/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/core-regression.yml"
  push:
    paths:
      - "lib/**"
      - "test/**"
      - "windows/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/core-regression.yml"

permissions:
  contents: read

concurrency:
  group: core-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core:
    name: Windows 查询、队列、身份与备份
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.4"
          cache: true
      - name: 解析依赖
        run: flutter pub get
      - name: 静态分析
        run: flutter analyze
      # 在 PR 阶段执行真实 SQLite 等价性和数据恢复，避免只在发布时发现核心回归。
      - name: 核心 focused tests
        run: >-
          flutter test
          test/library_search_index_equivalence_test.dart
          test/library_query_compiler_phase6_test.dart
          test/library_query_controller_test.dart
          test/library_performance_trace_test.dart
          test/library_scan_index_revision_test.dart
          test/library_search_input_coalescing_test.dart
          test/library_card_file_menu_test.dart
          test/checked_search_input_test.dart
          test/widget_test.dart
          test/library_playback_queue_controller_test.dart
          test/player_filter_transaction_test.dart
          test/library_stable_identity_phase2_test.dart
          test/library_store_test.dart
          test/library_data_backup_service_test.dart
          test/data_backup_controllers_test.dart
          test/library_sidebar_metrics_cache_test.dart
          test/library_search_filter_status_test.dart
          test/architecture_contract_test.dart
