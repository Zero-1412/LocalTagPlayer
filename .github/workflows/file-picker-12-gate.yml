name: file_picker 12 三平台门禁

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/file-picker-12-gate.yml"
      - "lib/src/platform/**"
      - "test/architecture_contract_test.dart"
      - "test/desktop_file_system_adapter_test.dart"
      - "tool/run_file_picker_12_probe.ps1"
      - "pubspec.yaml"
      - "pubspec.lock"
  push:
    paths:
      - ".github/workflows/file-picker-12-gate.yml"
      - "lib/src/platform/**"
      - "test/architecture_contract_test.dart"
      - "test/desktop_file_system_adapter_test.dart"
      - "tool/run_file_picker_12_probe.ps1"
      - "pubspec.yaml"
      - "pubspec.lock"

jobs:
  desktop-build:
    name: ${{ matrix.name }} 静态 API 与 Debug build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: windows
          - name: Linux
            runner: ubuntu-latest
            target: linux
          - name: macOS
            runner: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          cache: true
      - name: 安装 Linux 桌面依赖
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libsqlite3-dev
      - name: 运行独立 file_picker 12 探针
        shell: pwsh
        run: |
          ./tool/run_file_picker_12_probe.ps1 `
            -Flutter (Get-Command flutter).Source `
            -OutputDirectory "${{ runner.temp }}/file-picker-12-${{ matrix.target }}" `
            -BuildTarget "${{ matrix.target }}"
